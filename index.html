<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>explorer-app</title>
  </head>
<body class="flex min-h-screen flex-col scroll-smooth bg-neutral-50 text-neutral-900">
  <header class="border-b border-neutral-900 bg-blue-500 text-neutral-0">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 md:flex md:items-center md:justify-between lg:px-8">
      <div class="flex min-h-16 items-center justify-between md:min-h-20">
      <a
        href="#inicio"
        class="whitespace-nowrap text-lg font-bold text-neutral-0 sm:text-xl lg:text-2xl"
      >
        Where in the world?
      </a>

      <button
        id="menu-toggle"
        type="button"
        class="flex size-11 
        items-center 
        justify-center 
        rounded-md 
        md:hidden
        transition-colors
               hover:bg-blue-500 active:scale-95
               focus-visible:outline-2
               focus-visible:outline-offset-2
               focus-visible:outline-neutral-900"
               
        aria-controls="main-menu"
        aria-expanded="false"
        aria-label="Abrir menú de navegación"
      >
        <svg
          id="menu-open-icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>

        <svg
          id="menu-close-icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          class="hidden size-6"
        >
          <path
            stroke-linecap="round"
            stroke-width="2"
            d="M6 6l12 12M18 6 6 18"
          />
        </svg>
      </button>
      </div>

    <nav
      id="main-menu"
      class="hidden border-t border-neutral-0/20 pb-4 md:block md:border-0 md:pb-0"
      aria-label="Navegación principal"
    >
      <ul
        class="flex flex-col gap-1 text-sm
               md:flex-row md:items-center md:gap-5 lg:gap-6"
      >
        <li>
          <a href="#inicio" class="inline-block border-b-2 border-neutral-900 hover:text-neutral-900
           px-0 py-0 font-medium"
           aria-current="page">
           Inicio
          </a>
        </li>

        <li>
          <a
            href="#paises"
            class="block rounded-md px-3 py-3
                   transition-colors hover:bg-blue-500
                   focus-visible:outline-2
                   focus-visible:outline-neutral-900
                   md:px-0 md:py-2 md:hover:bg-transparent
                   md:hover:text-neutral-900"
          >
            Explorar países
          </a>
        </li>

        <li>
          <a
            href="#acerca-de"
            class="block rounded-md px-3 py-3
                   transition-colors hover:bg-blue-500
                   focus-visible:outline-2
                   focus-visible:outline-neutral-900
                   md:px-0 md:py-2 md:hover:bg-transparent
                   md:hover:text-neutral-900"
          >
            Acerca de
          </a>
        </li>
      </ul>
    </nav>
    </div>
  </header>

  <main id="inicio" class="mx-auto w-full max-w-7xl flex-1 px-4 py-10 sm:px-6 sm:py-12 lg:px-8 lg:py-16">
    <section id="home-view" aria-labelledby="explore-title">
      <div class="mb-8 md:mb-10">
        <h1 id="explore-title" class="max-w-2xl text-3xl font-semibold leading-tight
           text-neutral-900 md:text-4xl">
          Explora países del mundo
        </h1>
        <p class="mt-3 max-w-xl text-base leading-7 text-neutral-900">
          Busca un país o filtra los resultados por región.
        </p>
      </div>


      <div class="mb-12 flex flex-col gap-3 md:mb-16 md:flex-row md:items-center md:gap-4">
        <div class="relative flex-1">
          <label for="country-search" class="sr-only">Buscar un país</label>
          <span class="pointer-events-none absolute inset-y-0 left-5 flex items-center text-red-32"
            aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="size-5">
              <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
              <path d="m16 16 4 4" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </span>
          <input id="country-search" name="country-search" type="search" placeholder="Buscar el nombre del país..."
            autocomplete="off"
            class="h-12 w-full rounded-md border border-purple-600  bg-purple-350 py-3 pl-12 pr-5 text-base
             text-neutral-900 placeholder:text-neutral-900 transition-colors duration-200
              hover:border-purple-600  focus-visible:border-purple-600  focus-visible:outline-none focus-visible:ring-2
               focus-visible:ring-neutral-900 focus-visible:ring-offset-2" />
        </div>

        <div class="relative w-full  md:w-54 md:shrink-0">
          <label for="region-filter" class="sr-only">
            Filtrar por región
          </label>

          <select id="region-filter" name="region-filter"
            class="h-12 w-full md:w-54 md:shrink-0 appearance-none rounded-md border border-purple-500 bg-purple-350  py-2 pl-5 pr-12 text-base font-medium
             text-neutral-900 transition-colors duration-200 hover:border-blue-500 focus-visible:border-purple-600 focus-visible:outline-none focus-visible:ring-2
              focus-visible:ring-purple-500 focus-visible:ring-offset-2">
            <option value="">Filtrar por región</option>
            <option value="Africa">África</option>
            <option value="Americas">América</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europa</option>
            <option value="Oceania">Oceanía</option>
          </select>

          <span
            class="pointer-events-none absolute right-5 top-1/2 size-2.5 -translate-y-2/3 rotate-45 border-b-2 border-r-2 border-neutral-900"
            aria-hidden="true"></span>
        </div>
      </div>

      <div id="paises">
        <h2 class="mb-6 text-2xl font-semibold text-neutral-900 md:mb-8 md:text-3xl">
          Países disponibles
        </h2>

        <section id="countries-container" class="grid grid-cols-1 gap-6 
          sm:grid-cols-2 
          lg:grid-cols-3 lg:gap-8 
          xl:grid-cols-4" aria-label="Listado de países">
          
        </section>
      </div>
    </section>
    <section id="detail-view" hidden aria-live="polite"></section>
  </main>

  <footer id="acerca-de" class="mt-24 border-t border-neutral-900  bg-blue-500 text-neutral-0">
    <div
      class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-8 sm:px-6 md:flex-row md:items-center md:justify-between lg:px-8">
      <div>
        <p class="text-xs font-bold">Explorer App</p>
        <p class="mt-2 text-sm font-light text-neutral-50">
          © 2026 Explorer App. Datos proporcionados por REST Countries.
        </p>
      </div>

      <nav aria-label="Enlaces del pie de página">
        <ul class="flex flex-wrap gap-6 text-xs font-semibold">
          <li><a href="#" class="rounded-sm hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-purple-600 hover:text-neutral-900">Documentación</a></li>
          <li><a href="#" class="rounded-sm hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-purple-600 hover:text-neutral-900">Código fuente</a></li>
          <li><a href="#" class="rounded-sm hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-purple-600 hover:text-neutral-900">Privacidad</a></li>
        </ul>
      </nav>
    </div>
  </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
